{% extends "insurance/base.html" %}
{% load static %}
{% block insurance_base %}
<div class="tabcontent" id="addProvider">
    <div id="main-content">
        <div class="container">
            <p style="text-align: center;font-family:'Ubuntu';font-size: 3rem;text-align: center; color: rgb(92, 46, 13);">Add Insurance Provider</p>
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-body">
                            <form method="POST" enctype="multipart/form-data">
                                {% csrf_token %}
                                {% for field in form %}
                                    <div class="form-group">
                                        <label>{{ field.label }}</label>
                                        {{ field }}
                                        {% if field.errors %}
                                            <small class="text-danger">{{ field.errors|striptags }}</small>
                                        {% endif %}
                                    </div>
                                {% endfor %}
                                <div class="text-center mt-4">
                                    <button type="submit" class="btn btn-success btn-lg">
                                        <i class="fas fa-building"></i> Create Provider
                                    </button>
                                    <a href="{% url 'insurance:dashboard' %}" class="btn btn-secondary btn-lg">Cancel</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
